    <svg id="screen" width="880" height="612" x="23" y="50" viewBox="0 0 880 612" preserveAspectRatio="xMidYMin slice"><rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="808" class="foreground">$ tw-bisect run --good 20261101 --bad 20261105 --pkgs curl -- 'curl --version | grep -q nghttp2/1.70'</text></g><g id="g2"><text x="0" textLength="8" class="background"> </text></g><g id="g3"><text x="0" textLength="840" class="foreground">tw-bisect dev: 20261101 is good, 20261105 is bad, 3 snapshots in between; platform linux/amd64 via docker</text></g><g id="g4"><text x="0" textLength="408" class="foreground">test command: curl --version | grep -q nghttp2/1.70</text></g><g id="g5"><text x="0" textLength="240" class="foreground">[build] 20261101: image cached</text></g><g id="g6"><text x="0" textLength="184" class="foreground">[test ] 20261101 &#8594; good</text></g><g id="g7"><text x="0" textLength="240" class="foreground">[build] 20261105: image cached</text></g><g id="g8"><text x="0" textLength="176" class="foreground">[test ] 20261105 &#8594; bad</text></g><g id="g9"><text x="0" textLength="72" class="foreground">         </text></g><g id="g10"><text x="0" textLength="240" class="foreground">[build] 20261103: image cached</text></g><g id="g11"><text x="0" textLength="184" class="foreground">[test ] 20261103 &#8594; good</text></g><g id="g12"><text x="0" textLength="240" class="foreground">[build] 20261104: image cached</text></g><g id="g13"><text x="0" textLength="184" class="foreground">[test ] 20261104 &#8594; good</text></g><g id="g14"><text x="0" textLength="400" class="foreground">first bad snapshot: 20261105 (last good: 20261104)</text></g><g id="g15"><text x="0" textLength="504" class="foreground">5 of 83 installed packages differ between 20261104 and 20261105</text></g><g id="g16"><text x="0" textLength="696" class="foreground">[pkgs ] step 1: upgrading 2 of 5 candidates from 20261105 (libnghttp2-14, libnghttp3-9)</text></g><g id="g17"><text x="0" textLength="272" class="foreground">[pkgs ]   2 packages changed &#8594; bad</text></g><g id="g18"><text x="0" textLength="584" class="foreground">[pkgs ] step 2: upgrading 1 of 5 candidates from 20261105 (libnghttp2-14)</text></g><g id="g19"><text x="0" textLength="272" class="foreground">[pkgs ]   1 packages changed &#8594; bad</text></g><g id="g20"><text x="0" textLength="144" class="foreground">first bad package:</text></g><g id="g21"><text x="0" textLength="328" class="foreground">  libnghttp2-14  1.70.0-1.1 -&gt; 1.71.0-1.1</text></g><g id="g22"><text x="0" textLength="312" class="foreground">    | Version update (1.70.0 -&gt; 1.71.0)</text></g><g id="g23"><text x="0" textLength="48" class="foreground">    | </text></g><g id="g24"><text x="0" textLength="200" class="foreground">    | - Update to 1.71.0:</text></g><g id="g25"><text x="0" textLength="440" class="foreground">    |   * lib: add length check for CONTINUATION frames</text></g><g id="g26"><text x="0" textLength="536" class="foreground">    |   * lib: disallow HEADERS and PUSH_PROMISE in CONNECT streams</text></g><g id="g27"><text x="0" textLength="552" class="foreground">    |   * lib: fix priority update handling and update window upfront</text></g><g id="g28"><text x="0" textLength="504" class="foreground">    |   * lib: handle too large window size when consuming data</text></g><g id="g29"><text x="0" textLength="360" class="foreground">    |   * lib: fix signed integer overflow in</text></g><g id="g30"><text x="0" textLength="576" class="foreground">    |     nghttp2_session_get_stream_local_window_size and detect size_t</text></g><g id="g31"><text x="0" textLength="344" class="foreground">    |     overflow in nghttp2_nv_array_copy</text></g><g id="g32"><text x="0" textLength="488" class="foreground">    |   * lib: better map hasher and simplified map insertion</text></g><g id="g33"><text x="0" textLength="560" class="foreground">    |   * nghttpx: client TLS certificate validation based on RFC 9525</text></g><g id="g34"><text x="0" textLength="176" class="foreground">    | &#8230; (6 more lines)</text></g><g id="g35"><text x="0" textLength="880" class="foreground">snapshot range: 20261104 (good) -&gt; 20261105 (bad); repositories: https://download.opensuse.org/history/2026110</text></g><g id="g36"><text x="0" textLength="16" class="foreground">5/</text></g><g id="g37"><text x="0" textLength="608" class="foreground">changelog: https://download.opensuse.org/tumbleweed/iso/Changes.20261105.txt</text></g><g id="g38"><text x="0" textLength="104" class="foreground">done in 2m19s</text></g></defs><g id="screen_view"><g><use xlink:href="#g1" y="0"/><rect x="0" y="17" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="17"/></g><g><use xlink:href="#g1" y="646"/><use xlink:href="#g3" y="663"/><rect x="0" y="680" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="680"/></g><g><use xlink:href="#g1" y="1292"/><use xlink:href="#g3" y="1309"/><use xlink:href="#g4" y="1326"/><rect x="0" y="1343" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="1343"/></g><g><use xlink:href="#g1" y="1938"/><use xlink:href="#g3" y="1955"/><use xlink:href="#g4" y="1972"/><use xlink:href="#g5" y="1989"/><rect x="0" y="2006" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="2006"/></g><g><use xlink:href="#g1" y="2584"/><use xlink:href="#g3" y="2601"/><use xlink:href="#g4" y="2618"/><use xlink:href="#g5" y="2635"/><use xlink:href="#g6" y="2652"/><rect x="0" y="2669" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="2669"/></g><g><use xlink:href="#g1" y="3230"/><use xlink:href="#g3" y="3247"/><use xlink:href="#g4" y="3264"/><use xlink:href="#g5" y="3281"/><use xlink:href="#g6" y="3298"/><use xlink:href="#g7" y="3315"/><use xlink:href="#g8" y="3332"/><rect x="0" y="3349" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="3349"/></g><g><use xlink:href="#g1" y=